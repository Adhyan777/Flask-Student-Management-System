{% extends "base.html" %}

{% block content %}

<h2>Edit Student</h2>

<form method="POST">

    <div class="mb-3">
        <label>Name</label>
        <input type="text"
               class="form-control"
               name="name"
               value="{{ student.name }}"
               required>
    </div>

    <div class="mb-3">
        <label>Age</label>
        <input type="number"
               class="form-control"
               name="age"
               value="{{ student.age }}"
               required>
    </div>

    <div class="mb-3">
        <label>Department</label>
        <input type="text"
               class="form-control"
               name="department"
               value="{{ student.department }}"
               required>
    </div>

    <div class="mb-3">
        <label>CGPA</label>
        <input type="number"
               step="0.01"
               class="form-control"
               name="cgpa"
               value="{{ student.cgpa }}"
               required>
    </div>

    <button class="btn btn-success">
        Update Student
    </button>

</form>

{% endblock %}
