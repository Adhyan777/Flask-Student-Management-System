{% extends "base.html" %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Students</h2>

    <a href="/add" class="btn btn-primary">
        Add Student
    </a>
</div>

<form method="GET" action="/students" class="mb-3">

    <div class="row">

        <div class="col-md-5">

            <input
                type="text"
                class="form-control"
                name="search"
                placeholder="Search by name..."
                value="{{ search }}">

        </div>

        <div class="col-md-5">

            <select
                class="form-select"
                name="sort">

                <option value="name_asc" {% if sort=="name_asc" %}selected{% endif %}>Name (A-Z)</option>

                <option value="name_desc" {% if sort=="name_desc" %}selected{% endif %}>Name (Z-A)</option>

                <option value="age_asc" {% if sort=="age_asc" %}selected{% endif %}>Age (Low-High)</option>

                <option value="age_desc" {% if sort=="age_desc" %}selected{% endif %}>Age (High-Low)</option>

                <option value="cgpa_asc" {% if sort=="cgpa_asc" %}selected{% endif %}>CGPA (Low-High)</option>

                <option value="cgpa_desc" {% if sort=="cgpa_desc" %}selected{% endif %}>CGPA (High-Low)</option>

            </select>

        </div>

        <div class="col-md-2">

            <button class="btn btn-success w-100">

                Apply

            </button>

        </div>

    </div>

</form>

<table class="table table-bordered table-striped">

    <thead class="table-dark">

        <tr>

            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Department</th>
            <th>CGPA</th>
            <th>Actions</th>

        </tr>

    </thead>

    <tbody>

    {% for student in students %}

    <tr>

        <td>{{ student.id }}</td>
        <td>{{ student.name }}</td>
        <td>{{ student.age }}</td>
        <td>{{ student.department }}</td>
        <td>{{ student.cgpa }}</td>

        <td>

            <a href="/edit/{{ student.id }}"
               class="btn btn-warning btn-sm">

                Edit

            </a>

            <a href="/delete/{{ student.id }}"
               class="btn btn-danger btn-sm"
               onclick="return confirm('Delete this student?')">

                Delete

            </a>

        </td>

    </tr>

    {% endfor %}

    </tbody>

</table>

{% endblock %}
