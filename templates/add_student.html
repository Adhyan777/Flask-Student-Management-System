{% extends "base.html" %}

{% block content %}

<h2>Add Student</h2>

<form method="POST">

    <div class="mb-3">
        <label class="form-label">Name</label>
        <input
            type="text"
            class="form-control"
            name="name"
            required>
    </div>

    <div class="mb-3">
        <label class="form-label">Age</label>
        <input
            type="number"
            class="form-control"
            name="age"
            required>
    </div>

    <div class="mb-3">
        <label class="form-label">Department</label>
        <input
            type="text"
            class="form-control"
            name="department"
            required>
    </div>

    <div class="mb-3">
        <label class="form-label">CGPA</label>
        <input
            type="number"
            step="0.01"
            class="form-control"
            name="cgpa"
            required>
    </div>

    <button class="btn btn-primary">
        Add Student
    </button>

</form>

{% endblock %}
